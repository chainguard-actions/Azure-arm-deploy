name: Test failed deployment fails the action
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake az CLI
        run: |
          mkdir -p /tmp/fakeaz
          cp tests/fixtures/fake-az/az /tmp/fakeaz/az
          chmod +x /tmp/fakeaz/az
          : > /tmp/fakeaz/calls.log
          echo "/tmp/fakeaz" >> "$GITHUB_PATH"
      - id: action
        uses: .
        continue-on-error: true
        env:
          FAKE_AZ_CREATE_FAIL: "true"
        with:
          scope: resourcegroup
          resourceGroupName: my-rg
          template: tests/fixtures/template.json
          failOnStdErr: false
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          cat /tmp/fakeaz/calls.log
          if [ "$OUTCOME" != "failure" ]; then echo "FAIL: expected failure"; exit 1; fi
          grep -q '^deployment group create' /tmp/fakeaz/calls.log || { echo "FAIL: create not called"; exit 1; }
          echo "PASS"
