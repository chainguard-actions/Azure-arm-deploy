name: Test failOnStdErr default fails on stderr output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake az CLI
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-az/az" "$RUNNER_TEMP/fakebin/az"
          chmod +x "$RUNNER_TEMP/fakebin/az"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
          rm -f /tmp/fake-az-calls.log
      - id: action
        uses: .
        continue-on-error: true
        env:
          FAKE_AZ_STDERR: "1"
        with:
          scope: resourcegroup
          resourceGroupName: my-rg
          template: tests/fixtures/template.json
      - name: Assert action failed due to stderr
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          cat /tmp/fake-az-calls.log
          echo "outcome: $OUTCOME"
          grep -q '^deployment group create' /tmp/fake-az-calls.log || { echo "FAIL: create not called"; exit 1; }
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure since stderr was written and failOnStdErr defaults to true"
            exit 1
          fi
          echo "PASS"
