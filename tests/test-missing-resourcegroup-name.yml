name: Test resourcegroup scope without resourceGroupName fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake az CLI
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-az/az" "$RUNNER_TEMP/fakebin/az"
          chmod +x "$RUNNER_TEMP/fakebin/az"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
          rm -f /tmp/fake-az-calls.log
          touch /tmp/fake-az-calls.log
      - id: action
        uses: .
        continue-on-error: true
        with:
          scope: resourcegroup
          template: tests/fixtures/template.json
      - name: Assert action failed before calling az
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          cat /tmp/fake-az-calls.log
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when resourceGroupName is missing"
            exit 1
          fi
          if [ -s /tmp/fake-az-calls.log ]; then
            echo "FAIL: az should not have been called"
            exit 1
          fi
          echo "PASS"
