name: Test nonexistent resource group fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake az CLI
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-az/az" "$RUNNER_TEMP/fakebin/az"
          chmod +x "$RUNNER_TEMP/fakebin/az"
          echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
          rm -f /tmp/fake-az-calls.log
      - id: action
        uses: .
        continue-on-error: true
        with:
          scope: resourcegroup
          resourceGroupName: missing-rg
          template: tests/fixtures/template.json
      - name: Assert action failed after group lookup
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          cat /tmp/fake-az-calls.log
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for missing resource group"
            exit 1
          fi
          grep -q '^group show --resource-group missing-rg' /tmp/fake-az-calls.log || { echo "FAIL: group show not called"; exit 1; }
          if grep -q '^deployment' /tmp/fake-az-calls.log; then
            echo "FAIL: no deployment should run"
            exit 1
          fi
          echo "PASS"
