name: Test subscription scope deployment
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install fake az CLI
        run: |
          mkdir -p /tmp/fakeaz
          cp tests/fixtures/fake-az/az /tmp/fakeaz/az
          chmod +x /tmp/fakeaz/az
          : > /tmp/fakeaz/calls.log
          echo "/tmp/fakeaz" >> "$GITHUB_PATH"
      - id: action
        uses: .
        with:
          scope: subscription
          subscriptionId: 00000000-1111-2222-3333-444444444444
          region: eastus
          template: tests/fixtures/template.json
          deploymentName: sub-deploy
      - name: Assert outputs and az calls
        env:
          SA: ${{ steps.action.outputs.storageAccountName }}
        run: |
          echo "storageAccountName: $SA"
          cat /tmp/fakeaz/calls.log
          if [ "$SA" != "mystorage123" ]; then echo "FAIL: storageAccountName"; exit 1; fi
          grep -q '^account set --subscription 00000000-1111-2222-3333-444444444444' /tmp/fakeaz/calls.log || { echo "FAIL: account set not called"; exit 1; }
          grep -q '^deployment sub validate --location eastus --template-file tests/fixtures/template.json --name sub-deploy -o json' /tmp/fakeaz/calls.log || { echo "FAIL: validate args"; exit 1; }
          grep -q '^deployment sub create --location eastus --template-file tests/fixtures/template.json --name sub-deploy -o json' /tmp/fakeaz/calls.log || { echo "FAIL: create args"; exit 1; }
          if grep -q 'group show' /tmp/fakeaz/calls.log; then echo "FAIL: group show should not run"; exit 1; fi
          echo "PASS"
